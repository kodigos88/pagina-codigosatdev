<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .pacman {
      fill: #FFCC00;
    }
    .ghost {
      fill: #FF0033;
    }
    .dot {
      fill: #FFFFFF;
    }
    @keyframes chomp {
      0%, 100% {
        d: path('M16 16 L28 8 A 14 14 0 1 0 28 24 Z');
      }
      50% {
        d: path('M16 16 L30 15 A 14 14 0 1 0 30 17 Z');
      }
    }
    .mouth {
      animation: chomp 0.4s infinite ease-in-out;
    }
  </style>
  <!-- Background pixel frame / CRT dark bg -->
  <rect width="32" height="32" fill="#000000" rx="4" />
  
  <!-- Pac-Man body with mouth animation -->
  <path class="pacman mouth" d="M16 16 L28 8 A 14 14 0 1 0 28 24 Z" />
  
  <!-- Small retro eye -->
  <circle cx="16" cy="7" r="1.5" fill="#000000" />
</svg>
